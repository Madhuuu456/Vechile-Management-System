<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Services | Madhu Vehicle Service Management</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="header"></div>
<main class="container">
  <h1>🛠️ Services</h1>
  <p class="subtitle">Manage the list of services you offer and their prices.</p>
  <section class="card">
    <h2 id="form-title">Add New Service</h2>
    <form id="crud-form">
      <div id="fields" class="grid"></div>
      <div class="form-actions">
        <button type="submit" class="btn primary" id="submit-btn">Save</button>
        <button type="button" class="btn" id="cancel-btn">Clear</button>
      </div>
    </form>
  </section>
  <section class="card">
    <div class="table-head">
      <h2>All Services (<span id="count">0</span>)</h2>
      <input type="search" id="search" placeholder="Search...">
    </div>
    <div class="table-wrap"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div>
  </section>
</main>
<div id="footer"></div>
<script src="common.js"></script>
<script>
initCrud({
  endpoint: '/api/services', single: 'Service',
  fields: [
    { name: 'name', label: 'Service Name', required: true, placeholder: 'e.g. Oil Change' },
    { name: 'price', label: 'Price (₹)', type: 'number', required: true, attrs: 'min="0" step="0.01"', placeholder: '1500' },
    { name: 'description', label: 'Description', type: 'textarea' }
  ],
  columns: [
    { key: 'id', label: 'ID' }, { key: 'name', label: 'Service' }, { key: 'description', label: 'Description' },
    { label: 'Price', format: (r) => money(r.price) }
  ]
});
</script>
</body>
</html>
